<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>IPTV TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0e1015;--bg2:#151820;--card:#1b1f29;--card2:#252a37;--line:#2c3242;--txt:#eef1f7;--mut:#8d95a8;--dim:#5d6578;--acc:#4f8cff;--acc2:#7c5cff;--gold:#ffc542;--red:#ff5a6e}
*{box-sizing:border-box}
html{font-size:1.25vw}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.hidden{display:none!important}
img{border:0}
#v{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;object-fit:contain}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp5{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* açılış */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:radial-gradient(circle at 30% 20%,#1a2033,#07080c);color:var(--mut);font-size:1.3rem;z-index:1}
#splash b{font-size:4rem;letter-spacing:.1rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* canlı bant */
#banner{position:fixed;left:3rem;right:3rem;bottom:2.5rem;display:flex;align-items:center;gap:1.5rem;padding:1.2rem 1.8rem;border-radius:1rem;background:rgba(14,16,21,.94);box-shadow:0 .5rem 3rem #000a;transition:opacity .3s;z-index:3}
#banner.off{opacity:0}
#bnum{font-size:2.4rem;font-weight:700;color:var(--acc);min-width:4.5rem;text-align:center}
#blogo{width:5rem;height:5rem;border-radius:.7rem;background:#ffffff10;object-fit:contain;flex:none}
#bmain{flex:1;min-width:0}
#bname{font-size:1.9rem;font-weight:700}
#bepg{font-size:1.15rem;color:var(--mut);margin-top:.3rem}
#bepg b{color:var(--txt);font-weight:600}
.pbar{height:.35rem;background:#ffffff1c;border-radius:1rem;overflow:hidden;margin-top:.5rem}
.pbar i{display:block;height:100%;background:var(--acc)}
#bmsg{font-size:1.15rem;color:var(--gold);text-align:right;max-width:35%}
.spin{width:2.6rem;height:2.6rem;border:.3rem solid #fff3;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
#numbox{position:fixed;right:3rem;top:2.5rem;padding:.8rem 1.6rem;border-radius:1rem;background:rgba(14,16,21,.94);font-size:3rem;font-weight:700;z-index:6}
#toast{position:fixed;left:50%;top:2rem;transform:translateX(-50%);padding:.8rem 1.6rem;border-radius:.8rem;background:rgba(14,16,21,.96);font-size:1.2rem;z-index:9;border:.1rem solid var(--line)}

/* menü */
#menu{position:fixed;inset:0;display:flex;z-index:4}
#menu.live{background:linear-gradient(90deg,rgba(10,12,16,.97) 62%,rgba(10,12,16,.55) 80%,rgba(10,12,16,.2))}
#menu.vod{background:var(--bg)}
#rail{width:13rem;flex:none;background:rgba(0,0,0,.35);padding:2rem 0 2rem 1rem;display:flex;flex-direction:column;gap:.4rem}
#rail .logo{font-size:1.6rem;font-weight:800;padding:0 .9rem 1.4rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ri{display:flex;align-items:center;gap:.8rem;padding:.8rem .9rem;margin-right:1rem;border-radius:.7rem;font-size:1.2rem;color:var(--mut);border:.15rem solid transparent}
.ri .ic{width:1.6rem;text-align:center;font-size:1.3rem}
.ri.sel{color:var(--txt);background:var(--card)}
#cats{width:16rem;flex:none;display:flex;flex-direction:column;gap:.3rem;overflow:hidden;padding:2rem .8rem 2rem .8rem;border-right:.1rem solid #ffffff0d}
.cat{padding:.6rem .9rem;border-radius:.6rem;font-size:1.1rem;color:var(--mut);height:2.9rem;flex:none;border:.15rem solid transparent}
.cat.sel{color:var(--txt);background:var(--card)}
#content{flex:1;min-width:0;position:relative;overflow:hidden}
.foc{border-color:#fff!important;background:var(--acc)!important;color:#fff!important}
.foc .no,.foc .sub{color:#e8eeff!important}

/* canlı liste */
#live{display:flex;height:100%}
#list{width:31rem;flex:none;display:flex;flex-direction:column;gap:.3rem;overflow:hidden;padding:2rem .8rem}
#lhead{color:var(--mut);font-size:1rem;padding:.1rem .9rem .5rem}
.ch{display:flex;align-items:center;gap:.9rem;padding:.45rem .8rem;border-radius:.6rem;height:3.9rem;flex:none;background:var(--card);border:.15rem solid transparent;font-size:1.15rem}
.ch .no{width:2.6rem;text-align:right;color:var(--mut);flex:none;font-size:1rem}
.ch img,.ch .ph{width:2.7rem;height:2.7rem;border-radius:.45rem;object-fit:contain;background:#ffffff0d;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:700}
.ch .t{flex:1;min-width:0}
.ch .sub{color:var(--mut);font-size:.9rem}
.ch .st{color:var(--gold);flex:none}
.ch.play{background:var(--card2)}
.ch.play .t>div:first-child{color:#9fc0ff}
.foc.ch.play .t>div:first-child{color:#fff}
#linfo{flex:1;padding:2.4rem 2rem;display:flex;flex-direction:column;gap:.6rem}
#linfo .big{font-size:1.7rem;font-weight:700}
#linfo .lab{font-size:.95rem;color:var(--acc);text-transform:uppercase;letter-spacing:.08rem;margin-top:1rem}
#linfo .pt{font-size:1.25rem;font-weight:600}
#linfo .desc{font-size:1.05rem;color:var(--mut)}
#linfo .time{font-size:1rem;color:var(--mut)}

/* film/dizi ızgarası */
#vod{height:100%;display:flex;flex-direction:column}
#hero{height:12.5rem;flex:none;position:relative;padding:2rem 2rem 0 2rem;overflow:hidden}
#hero .bd{position:absolute;right:0;top:0;width:65%;height:100%;object-fit:cover;opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
#hero .in{position:relative;width:62%}
#hero h1{margin:0;font-size:2rem;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;font-size:1.05rem;color:var(--mut);margin:.4rem 0 .6rem}
.meta .rt{color:var(--gold);font-weight:600}
.meta .tag{border:.1rem solid var(--line);border-radius:.4rem;padding:0 .5rem}
#hero .plot{font-size:1.05rem;color:#c5cad6;line-height:1.45}
#gridwrap{flex:1;overflow:hidden;padding:.6rem 1.4rem 0}
#ghead{font-size:1.05rem;color:var(--mut);padding:0 .6rem .5rem}
#grid{display:flex;flex-wrap:wrap}
.pc{width:8rem;margin:0 .45rem .8rem;flex:none}
.pc .po{width:8rem;height:12rem;border-radius:.7rem;overflow:hidden;background:var(--card);border:.2rem solid transparent;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:.5rem;color:var(--mut);font-size:1rem;transition:transform .12s}
.pc .po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .po .bdg{position:absolute;left:.4rem;top:.4rem;background:rgba(0,0,0,.75);color:var(--gold);font-size:.85rem;font-weight:700;padding:.1rem .45rem;border-radius:.35rem}
.pc .po .fv{position:absolute;right:.4rem;top:.3rem;color:var(--gold);font-size:1.1rem;text-shadow:0 0 .3rem #000}
.pc .po .pr{position:absolute;left:0;right:0;bottom:0;height:.3rem;background:#0008}
.pc .po .pr i{display:block;height:100%;background:var(--red)}
.pc .ti{font-size:.95rem;color:var(--mut);margin-top:.35rem;padding:0 .2rem}
.pc.foc{background:transparent!important;border:0}
.pc.foc .po{border-color:#fff;transform:scale(1.06)}
.pc.foc .ti{color:#fff}
#empty{color:var(--mut);font-size:1.2rem;padding:2rem}

/* detay */
#detail{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:hidden}
#detail .bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
#detail .sh{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 30%,rgba(14,16,21,.75) 60%,rgba(14,16,21,.35)),linear-gradient(0deg,var(--bg),transparent 40%)}
#detail .wrap{position:relative;display:flex;gap:2.5rem;padding:3rem 3.5rem;height:100%}
#dposter{width:17rem;height:25.5rem;border-radius:1rem;object-fit:cover;background:var(--card);flex:none;box-shadow:0 1rem 3rem #000a}
#dmain{flex:1;min-width:0;display:flex;flex-direction:column}
#dmain h1{margin:0;font-size:2.5rem}
#dplot{font-size:1.2rem;line-height:1.5;color:#cfd3dd;max-width:52rem}
.crew{font-size:1.05rem;color:var(--mut);margin-top:.8rem;max-width:52rem}
.crew b{color:#c5cad6;font-weight:600}
#dbtns{display:flex;gap:1rem;margin-top:1.6rem}
.bt{padding:.85rem 1.8rem;border-radius:.7rem;background:var(--card2);font-size:1.2rem;font-weight:600;border:.15rem solid transparent}
#seasons{display:flex;gap:.6rem;margin-top:1.4rem;flex-wrap:nowrap;overflow:hidden}
.ss{padding:.5rem 1.1rem;border-radius:.6rem;background:var(--card);font-size:1.05rem;color:var(--mut);border:.15rem solid transparent;flex:none}
.ss.sel{color:#fff;background:var(--card2)}
#eps{margin-top:1rem;display:flex;flex-direction:column;gap:.45rem;overflow:hidden;flex:1}
.ep{display:flex;gap:1rem;align-items:center;padding:.5rem;border-radius:.7rem;background:rgba(27,31,41,.85);border:.15rem solid transparent;height:6rem;flex:none}
.ep img,.ep .ph{width:9.5rem;height:5rem;border-radius:.5rem;object-fit:cover;background:var(--card2);flex:none}
.ep .t{flex:1;min-width:0}
.ep .h{font-size:1.1rem;font-weight:600}
.ep .sub{font-size:.95rem;color:var(--mut)}
.ep .pr{height:.25rem;background:#ffffff1c;border-radius:1rem;margin-top:.35rem;overflow:hidden}
.ep .pr i{display:block;height:100%;background:var(--red)}

/* oynatıcı OSD */
#osd{position:fixed;left:0;right:0;bottom:0;padding:5rem 3rem 2.2rem;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);z-index:3;transition:opacity .3s}
#osd.off{opacity:0}
#otitle{font-size:1.7rem;font-weight:700}
#osub{font-size:1.05rem;color:var(--mut);margin-top:.2rem}
#obar{height:.45rem;background:#ffffff30;border-radius:1rem;margin-top:1.2rem;position:relative}
#obar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:1rem}
#obar b{position:absolute;top:50%;width:1.1rem;height:1.1rem;margin:-.55rem 0 0 -.55rem;border-radius:50%;background:#fff}
#otime{display:flex;justify-content:space-between;font-size:1.05rem;color:#c5cad6;margin-top:.6rem}
#ohint{font-size:.95rem;color:var(--mut);margin-top:.6rem}
#ostate{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:4rem;z-index:3;text-shadow:0 0 1rem #000}

/* parça seçimi */
#tracks{position:fixed;right:3rem;bottom:9rem;width:26rem;background:rgba(14,16,21,.97);border:.1rem solid var(--line);border-radius:1rem;padding:1rem;z-index:7}
#tracks h3{margin:.3rem .5rem .5rem;font-size:1rem;color:var(--acc);text-transform:uppercase;letter-spacing:.08rem}
.tr{padding:.6rem .9rem;border-radius:.6rem;font-size:1.15rem;border:.15rem solid transparent}
.tr.on:before{content:"✓ ";color:var(--acc)}
.tr.foc.on:before{color:#fff}
#tracks .note{font-size:.95rem;color:var(--mut);padding:.4rem .5rem}

/* alt ipucu */
#keys{position:fixed;left:1.5rem;bottom:.5rem;font-size:.95rem;color:var(--mut);z-index:4}
#keys span{margin-right:1.4rem}
.key{display:inline-block;width:.85rem;height:.85rem;border-radius:50%;vertical-align:middle;margin-right:.3rem}

/* ayarlar */
#set{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:8}
#set .box{width:56rem;max-height:94%;overflow:hidden;background:#11141b;border-radius:1.4rem;padding:2rem 2.5rem;display:flex;flex-direction:column;gap:.8rem;border:.1rem solid var(--line)}
#set h2{margin:0 0 .3rem;font-size:1.8rem}
#set label{font-size:1rem;color:var(--mut);margin-bottom:-.5rem}
#set input{font:inherit;font-size:1.3rem;color:var(--txt);background:var(--card);border:.18rem solid var(--line);border-radius:.8rem;padding:.7rem 1rem;width:100%;outline:none}
#set input.foc{background:var(--card2)!important}
.row{display:flex;gap:1rem}
.btn{flex:1;padding:.9rem;border-radius:.8rem;background:var(--card2);font-weight:600;font-size:1.3rem;text-align:center;border:.18rem solid transparent}
#smsg{font-size:1.15rem;color:#ff8a8a;min-height:1.5rem}
.hint{font-size:1rem;color:var(--mut)}
/* imleç (fare) modu */
#tap{position:fixed;inset:0;z-index:2}
#pbar{position:fixed;left:50%;top:1.5rem;transform:translateX(-50%);display:flex;gap:.8rem;z-index:6;background:rgba(14,16,21,.92);padding:.7rem;border-radius:1rem;border:.1rem solid var(--line)}
.pb{white-space:nowrap;padding:.8rem 1.4rem;border-radius:.7rem;background:var(--card2);font-size:1.3rem;font-weight:600;border:.15rem solid transparent;cursor:pointer}
.pg{display:none;justify-content:center;gap:.6rem;flex:none;padding:.3rem 0}
.pg span{flex:1;text-align:center;padding:.45rem;border-radius:.6rem;background:var(--card2);font-size:1.2rem;cursor:pointer;border:.15rem solid transparent}
body.ptr .pg{display:flex}
#mclose,#dback{display:none;position:fixed;top:1.2rem;z-index:6;padding:.6rem 1.2rem;border-radius:.7rem;background:var(--card2);font-size:1.15rem;font-weight:600;cursor:pointer;border:.15rem solid transparent}
#mclose{right:1.5rem}#dback{left:1.5rem;top:.6rem}
body.ptr #mclose,body.ptr #dback{display:block}
body.ptr .ch:hover,body.ptr .cat:hover,body.ptr .ri:hover,body.ptr .bt:hover,body.ptr .ss:hover,body.ptr .ep:hover,body.ptr .tr:hover,body.ptr .btn:hover,body.ptr .pb:hover,body.ptr .pg span:hover,body.ptr #mclose:hover,body.ptr #dback:hover{border-color:#fff;background:var(--acc);color:#fff}
body.ptr .pc:hover .po{border-color:#fff;transform:scale(1.06)}
body.ptr #obar{height:1rem;cursor:pointer}
body.ptr #obar b{width:1.6rem;height:1.6rem;margin:-.8rem 0 0 -.8rem}
#sq{position:fixed;left:50%;top:1.5rem;transform:translateX(-50%);width:34rem;z-index:9;font:inherit;font-size:1.3rem;color:var(--txt);background:var(--card);border:.18rem solid #fff;border-radius:.8rem;padding:.7rem 1rem;outline:none}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="tap"></div>
<div id="pbar" class="hidden"></div>
<div id="splash"><b>IPTV</b><span id="splmsg">Yükleniyor…</span></div>

<div id="banner" class="off">
  <div id="bnum"></div><img id="blogo" alt="">
  <div id="bmain"><div id="bname" class="ell"></div><div id="bepg"></div></div>
  <div id="bmsg"></div>
</div>
<div id="numbox" class="hidden"></div>
<div id="toast" class="hidden"></div>

<div id="osd" class="hidden off">
  <div id="otitle" class="ell"></div><div id="osub" class="ell"></div>
  <div id="obar"><i></i><b></b></div>
  <div id="otime"><span id="ocur">0:00</span><span id="odur">0:00</span></div>
  <div id="ohint">OK: Durdur/Oynat · ◄ 10 sn geri · ► 30 sn ileri · ▲ Dil / Altyazı · Geri: Çık</div>
</div>
<div id="ostate" class="hidden"></div>
<div id="tracks" class="hidden"></div>

<div id="menu" class="hidden">
  <div id="rail"></div>
  <div id="cats"></div>
  <div id="content">
    <div id="live">
      <div id="list"></div>
      <div id="linfo"></div>
    </div>
    <div id="vod" class="hidden">
      <div id="hero"></div>
      <div id="gridwrap"><div id="ghead"></div><div id="grid"></div><div class="pg"><span data-act="pg:items:-1">▲ Önceki</span><span data-act="pg:items:1">▼ Sonraki</span></div></div>
    </div>
  </div>
</div>

<div id="detail" class="hidden">
  <img class="bd" id="dbd" alt=""><div class="sh"></div><div id="dback" data-act="dback">← Geri</div>
  <div class="wrap">
    <img id="dposter" alt="">
    <div id="dmain"></div>
  </div>
</div>

<div id="keys" class="hidden"></div>
<div id="mclose" class="hidden" data-act="mclose">✕ Kapat</div>
<input id="sq" class="hidden" placeholder="Ara…" autocapitalize="off" autocorrect="off" spellcheck="false">

<div id="set" class="hidden">
  <div class="box">
    <h2>Xtream Codes girişi</h2>
    <label>Sunucu</label><input class="f" readonly id="xs" placeholder="http://ornek.com:8080" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row">
      <div style="flex:1;display:flex;flex-direction:column;gap:.8rem"><label>Kullanıcı adı</label><input class="f" readonly id="xu" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:.8rem"><label>Şifre</label><input class="f" readonly id="xp" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </div>
    <label>Aracı sunucu (proxy) adresi — gerekirse</label><input class="f" readonly id="pxu" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Proxy anahtarı</label><input class="f" readonly id="pxk" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="smsg"></div>
    <div class="row"><div class="btn f" id="xlogin">Giriş yap</div><div class="btn f" id="xclose">Kapat</div><div class="btn f" id="xclear">Verileri sil</div></div>
    <div class="hint">Bilgiler sadece bu cihazda saklanır.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
/* ================= yardımcılar ================= */
var $=function(s){return document.querySelector(s)};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function b64(s){try{return decodeURIComponent(escape(atob(s||'')))}catch(e){return s||''}}
function hm(ts){var d=new Date(ts*1000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function fmt(t){t=Math.max(0,Math.floor(t||0));var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+s).slice(-2)}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.add('hidden')},2500)}
function num(x){var n=parseFloat(x);return isNaN(n)?0:n}

var vid=$('#v');
var proxy=LS.get('proxy',null);
var direct=LS.get('tvdirect',true);
var DEFAULT_PROXY='https://iptv-proxy.dilmenseref.workers.dev';
var EV=!!window.EV_SUNUCU;
if(EV){proxy={url:location.origin,key:'ev'};direct=false}
function viaProxy(u){return proxy&&proxy.url?proxy.url+'/?k='+encodeURIComponent(proxy.key)+'&u='+encodeURIComponent(u):u}
function media(u){return (!direct&&/^http:/i.test(u))?viaProxy(u):u}
function img(u){if(!u)return '';return (location.protocol==='https:'&&/^http:/i.test(u)&&proxy&&proxy.url)?viaProxy(u):u}
function imgTag(u){return u?'<img src="'+esc(img(u))+'" loading="lazy" onerror="this.style.display=\'none\'">':''}

/* ================= Xtream ================= */
var X=null; // {server,user,pass,proxy:bool}
function fetchText(u){return fetch(u).then(function(r){return r.text().then(function(t){return {status:r.status,text:t}})})}
function normServer(s){s=String(s).trim().replace(/\s+/g,'');if(!/^https?:\/\//i.test(s))s='http://'+s;try{var su=new URL(s);s=su.protocol+'//'+su.host}catch(e){}return s}
function apiUrl(c,a,extra){return c.server+'/player_api.php?username='+encodeURIComponent(c.user)+'&password='+encodeURIComponent(c.pass)+(a?'&action='+a:'')+(extra||'')}
function rawGet(c,u){
  var p=c.proxy?fetchText(viaProxy(u)):fetchText(u);
  return p.then(function(r){
    if(!c.proxy&&proxy&&proxy.url&&(r.status===401||r.status===403||/INVALID_AUTH|"auth":\s*"?0|^\s*\[\s*\]\s*$/.test(r.text))){c.proxy=true;return fetchText(viaProxy(u))}
    return r;
  },function(){
    if(c.proxy||!(proxy&&proxy.url))throw new Error(c.proxy?'Aracı sunucuya bağlanılamadı.':'Sunucuya doğrudan bağlanılamadı. Proxy adresini ve anahtarını gir.');
    c.proxy=true;return fetchText(viaProxy(u));
  }).then(function(r){

    try{return JSON.parse(r.text)}catch(e){throw new Error('Sunucu beklenmeyen yanıt verdi (HTTP '+r.status+'): '+r.text.replace(/\s+/g,' ').slice(0,90))}

function login(s,u,p){

    var via=c.proxy?' ['+(EV?'tablet':'proxy')+' üzerinden]':' [doğrudan]';

    if(!ui)throw new Error('Bu adres Xtream sunucusu gibi yanıt vermedi'+via+': '+JSON.stringify(info).slice(0,100));
    if(String(ui.auth)==='0')throw new Error('Kullanıcı adı veya şifre hatalı'+via+'.');
    if(ui.status&&ui.status!=='Active')throw new Error('Hesap durumu: '+ui.status+via);

function vodKey(V,x){return String(V.kind==='movies'?x.stream_id:x.series_id)}
function vodSource(V){
  if(V.cat===0){
    var arr=[];for(var k in resume){var r=resume[k];if((V.kind==='movies'&&r.type==='m')||(V.kind==='series'&&r.type==='e'))arr.push(r)}
    arr.sort(function(a,b){return b.ts-a.ts});
    var seen={};return Promise.resolve(arr.map(function(r){return r.item}).filter(function(it){if(!it)return false;var k=vodKey(V,it);if(seen[k])return false;seen[k]=1;return true}));
  }
  if(V.cat===1){var f=V.kind==='movies'?favM:favS;return Promise.resolve(Object.keys(f).map(function(k){return f[k]}))}
  var c=V.cats[V.cat-2];if(!c)return Promise.resolve([]);
  if(V.cache[c.category_id])return Promise.resolve(V.cache[c.category_id]);
  return api(V.kind==='movies'?'get_vod_streams':'get_series','&category_id='+encodeURIComponent(c.category_id)).then(function(l){l=Array.isArray(l)?l:[];V.cache[c.category_id]=l;return l});

}
function vodSearch(V,q){

  p.then(function(l){if(V.query!==q)return;var s=q.toLocaleLowerCase('tr');V.loading=false;V.items=l.filter(function(x){return String(x.name||'').toLocaleLowerCase('tr').indexOf(s)>=0}).slice(0,500);if(screen==='menu')drawMenu()}).catch(function(e){V.loading=false;toast(e.message);drawMenu()});

function poster(V,x){return V.kind==='movies'?x.stream_icon:x.cover}
function rating(x){var r=num(x.rating);if(!r&&x.rating_5based)r=num(x.rating_5based)*2;return r?r.toFixed(1):''}
function year(x){var y=x.year||x.releaseDate||x.releasedate||x.release_date||'';var m=String(y).match(/\d{4}/);if(m)return m[0];m=String(x.name||'').match(/\((\d{4})\)/);return m?m[1]:''}
function dur(i){if(i.duration){var m=String(i.duration).match(/^(\d+):(\d+)/);if(m){var h=+m[1],mi=+m[2];return (h?h+' sa ':'')+mi+' dk'}return i.duration}if(i.duration_secs){var s=num(i.duration_secs);return (s>=3600?Math.floor(s/3600)+' sa ':'')+Math.round(s%3600/60)+' dk'}return ''}

var hls=null,retries=0,playing=null;
function stopMedia(){if(hls){hls.destroy();hls=null}vid.pause();vid.removeAttribute('src');try{vid.load()}catch(e){}}
function startHls(u,orig,onfail){
  if(!(window.Hls&&Hls.isSupported())){nativePlay(u);return}
  var h=hls=new Hls({maxBufferLength:30,enableWorker:true});
  h.loadSource(u);h.attachMedia(vid);
  h.on(Hls.Events.MANIFEST_PARSED,function(){vid.play().catch(needOk)});
  h.on(Hls.Events.ERROR,function(_,d){
    if(!d.fatal||h!==hls)return;
    if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&retries<2){retries++;h.recoverMediaError();return}
    if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&retries<2){retries++;setTimeout(function(){if(h===hls)h.startLoad()},1000);return}
    if(u===orig&&/^http:/i.test(orig)&&proxy&&proxy.url){h.destroy();hls=null;retries=0;startHls(viaProxy(orig),orig,onfail);return}
    onfail();
  });
}
function nativePlay(u){vid.src=u;vid.load();vid.play().catch(needOk)}
function needOk(e){if(e&&e.name==='NotAllowedError'){if(playing&&playing.kind==='live')banner('Başlatmak için OK\'e bas',true);else toast('Başlatmak için OK\'e bas')}}

var osdT,lastSave=0,pendingSeek=0;
function playVod(p,from){
  saveVodPos();
  playing={kind:'vod',p:p};retries=0;pendingSeek=from>5?from:0;
  $('#detail').classList.add('hidden');$('#menu').classList.add('hidden');$('#keys').classList.add('hidden');$('#banner').classList.add('off');$('#splash').classList.add('hidden');
  screen='player';stopMedia();
  $('#otitle').textContent=p.title;$('#osub').textContent=p.sub||'';
  var u=media(p.url);
  if(/\.m3u8/i.test(p.url))startHls(u,p.url,function(){toast('Video açılamadı')});
  else nativePlay(u);
  showOsd();
}
vid.addEventListener('loadedmetadata',function(){if(pendingSeek&&playing&&playing.kind==='vod'){try{vid.currentTime=pendingSeek}catch(e){}pendingSeek=0}});
function saveVodPos(){
  if(!playing||playing.kind!=='vod'||!vid.duration||!isFinite(vid.duration))return;
  var p=playing.p,t=vid.currentTime,d=vid.duration;
  if(t>Math.max(d*0.95,d-90)){if(resume[p.key]){delete resume[p.key];LS.set('resume',resume)}return}
  if(t<20)return;
  resume[p.key]={t:t,d:d,ts:Date.now(),type:p.type,id:p.id,sid:p.sid,season:p.season,item:p.item};
  var ks=Object.keys(resume);if(ks.length>60){ks.sort(function(a,b){return resume[a].ts-resume[b].ts});delete resume[ks[0]]}
  LS.set('resume',resume);
}
function showOsd(stay){
  if(!playing||playing.kind!=='vod')return;
  var o=$('#osd');o.classList.remove('hidden');o.classList.remove('off');updOsd();
  clearTimeout(osdT);if(!stay&&!vid.paused)osdT=setTimeout(function(){o.classList.add('off')},4000);
}
function hideOsd(){$('#osd').classList.add('hidden');$('#ostate').classList.add('hidden');$('#tracks').classList.add('hidden')}
function updOsd(){var d=vid.duration||0,t=vid.currentTime||0,p=d&&isFinite(d)?t/d*100:0;$('#obar i').style.width=p+'%';$('#obar b').style.left=p+'%';$('#ocur').textContent=fmt(t);$('#odur').textContent=d&&isFinite(d)?fmt(d):'--:--'}
vid.addEventListener('timeupdate',function(){
  if(playing&&playing.kind==='vod'){if(!$('#osd').classList.contains('off'))updOsd();if(Date.now()-lastSave>10000){lastSave=Date.now();saveVodPos()}}
});
vid.addEventListener('playing',function(){$('#ostate').classList.add('hidden');if(playing&&playing.kind==='live')banner('');else showOsd()});
vid.addEventListener('waiting',function(){if(playing&&playing.kind==='vod'){var s=$('#ostate');s.innerHTML='<span class="spin"></span>';s.classList.remove('hidden')}});
vid.addEventListener('error',function(){
  if(!playing||hls||!vid.getAttribute('src'))return;
  if(playing.kind==='live'){banner('⚠ Kanal açılamadı',true);return}
  var p=playing.p;
  if(direct&&/^http:/i.test(p.url)&&proxy&&proxy.url&&vid.src.indexOf(proxy.url)!==0){pendingSeek=vid.currentTime||pendingSeek;vid.src=viaProxy(p.url);vid.load();vid.play().catch(needOk);return}
  $('#ostate').classList.add('hidden');
  toast('Video oynatılamadı. Dosya biçimi ('+(p.url.split('.').pop()||'?').toUpperCase()+') TV tarayıcısında desteklenmiyor olabilir.');
});
vid.addEventListener('ended',function(){
  if(!playing||playing.kind!=='vod')return;
  var p=playing.p;if(resume[p.key]){delete resume[p.key];LS.set('resume',resume)}
  if(p.type==='e'&&D&&D.eps[D.eidx+1]){toast('Sonraki bölüm başlıyor');playEp(D.eidx+1,false);return}
  exitVod();
});
function exitVod(){

/* ================= kumanda ================= */
var K={UP:38,DOWN:40,LEFT:37,RIGHT:39,OK:13,BACK:[8,27,461,10009,166,4],CHUP:[33,427],CHDN:[34,428],RED:403,GREEN:404,YELLOW:405,BLUE:406,INFO:457,PLAY:415,PAUSE:19,PP:179,STOP:413,FF:417,RW:412};
function isBack(k){return K.BACK.indexOf(k)>=0}
function inA(k,a){return a.indexOf(k)>=0}
function leaveMenuToPlayer(){if(playing&&(LIVE.cur>=0||playing.kind==='vod')){closeMenu();if(playing.kind==='live')banner('');return true}return false}

function keyMenu(k){
  if(zone==='rail'){
    if(k===K.UP)railIdx=Math.max(0,railIdx-1);
    else if(k===K.DOWN)railIdx=Math.min(SECS.length-1,railIdx+1);
    else if(k===K.RIGHT||k===K.OK){var s=SECS[railIdx].k;if(s==='settings'){openSet();return}if(s==='search'){search();return}if(s!==sec){openMenu(s);zone='cats'}else zone='cats'}
    else if(isBack(k)){if(leaveMenuToPlayer())return}
    else return false;
    drawMenu();return;
  }
  if(zone==='cats'){
    var live=sec==='live',V=live?null:curV(),n=live?LIVE.cats.length:vodCatNames(V).length,cur=live?LIVE.cat:V.cat,nx=cur;
    if(k===K.UP)nx=cur>0?cur-1:n-1;else if(k===K.DOWN)nx=cur<n-1?cur+1:0;
    else if(inA(k,K.CHUP))nx=Math.max(0,cur-CROWS);else if(inA(k,K.CHDN))nx=Math.min(n-1,cur+CROWS);
    else if(k===K.LEFT||isBack(k)){zone='rail';railIdx=secIdx();drawMenu();return}
    else if(k===K.RIGHT||k===K.OK){if(live?LIVE.view.length:V.items.length)zone='items';drawMenu();return}
    else return false;
    if(nx!==cur){if(live){LIVE.cat=nx;LIVE.query='';liveFilter();drawMenu()}else selectVodCat(V,nx)}
    return;
  }
  if(sec==='live'){
    var L=LIVE;
    if(k===K.UP)L.idx=L.idx>0?L.idx-1:L.view.length-1;
    else if(k===K.DOWN)L.idx=L.idx<L.view.length-1?L.idx+1:0;
    else if(inA(k,K.CHUP))L.idx=Math.max(0,L.idx-ROWS);
    else if(inA(k,K.CHDN))L.idx=Math.min(L.view.length-1,L.idx+ROWS);
    else if(k===K.LEFT)zone='cats';
    else if(k===K.OK){var c=L.view[L.idx];if(c){if(L.list[L.cur]===c&&playing&&playing.kind==='live'){closeMenu();banner('');return}playLive(L.list.indexOf(c))}}
    else if(k===K.RED){var c2=L.view[L.idx];if(c2){L.favs.has(c2.id)?L.favs.delete(c2.id):L.favs.add(c2.id);LS.set('tvfavs',Array.from(L.favs));toast(L.favs.has(c2.id)?'Favorilere eklendi':'Favorilerden çıkarıldı');if(L.cats[L.cat]==='★ Favoriler')liveFilter(true)}}
    else if(isBack(k)){if(L.query){L.query='';liveFilter()}else if(leaveMenuToPlayer())return;else zone='cats'}
    else return false;
    if(L.idx<0)L.idx=0;drawMenu();return;
  }
  var V2=curV(),n2=V2.items.length,col=V2.idx%GCOLS;
  if(k===K.LEFT){if(col===0)zone='cats';else V2.idx--}
  else if(k===K.RIGHT){if(V2.idx<n2-1)V2.idx++}
  else if(k===K.UP){if(V2.idx-GCOLS>=0)V2.idx-=GCOLS}
  else if(k===K.DOWN){if(V2.idx+GCOLS<n2)V2.idx+=GCOLS;else if(Math.floor(V2.idx/GCOLS)<Math.floor((n2-1)/GCOLS))V2.idx=n2-1}
  else if(inA(k,K.CHUP))V2.idx=Math.max(0,V2.idx-GCOLS*GROWS);
  else if(inA(k,K.CHDN))V2.idx=Math.min(n2-1,V2.idx+GCOLS*GROWS);
  else if(k===K.OK){var x=V2.items[V2.idx];if(x){openDetail(V2,x);return}}
  else if(k===K.RED){var x2=V2.items[V2.idx];if(x2){toggleFav(V2,x2);if(V2.cat===1&&!V2.query){selectVodCat(V2,1);return}}}
  else if(isBack(k)){if(V2.query){selectVodCat(V2,V2.cat);return}zone='cats'}
  else return false;
  drawMenu();
}
function keyDetail(k){
  if(isBack(k)){if(D.zone==='eps'||D.zone==='seasons'){D.zone='btns';drawDetail();return}closeDetail();return}
  if(k===K.OK){detailOk();return}
  if(k===K.RED){toggleFav(D.V,D.item);drawDetail();return}
  if(D.zone==='btns'){
    if(k===K.LEFT)D.bidx=Math.max(0,D.bidx-1);else if(k===K.RIGHT)D.bidx=Math.min(D.btns.length-1,D.bidx+1);
    else if(k===K.DOWN&&D.seasons.length)D.zone='seasons';else return false;
  }else if(D.zone==='seasons'){
    if(k===K.LEFT||k===K.RIGHT){var ns=Math.max(0,Math.min(D.seasons.length-1,D.sidx+(k===K.LEFT?-1:1)));if(ns!==D.sidx){D.sidx=ns;D.eps=(D.info.episodes||{})[D.seasons[ns]]||[];D.eidx=0;D.etop=0}}
    else if(k===K.UP)D.zone='btns';else if(k===K.DOWN&&D.eps.length)D.zone='eps';else return false;
  }else{
    if(k===K.UP){if(D.eidx>0)D.eidx--;else D.zone='seasons'}
    else if(k===K.DOWN)D.eidx=Math.min(D.eps.length-1,D.eidx+1);
    else if(inA(k,K.CHUP))D.eidx=Math.max(0,D.eidx-4);else if(inA(k,K.CHDN))D.eidx=Math.min(D.eps.length-1,D.eidx+4);
    else return false;
  }
  drawDetail();
}
function keyPlayer(k){
  if(!playing){openMenu();return}
  if(playing.kind==='live'){
    if(k===K.UP||inA(k,K.CHUP))zap(1);
    else if(k===K.DOWN||inA(k,K.CHDN))zap(-1);
    else if(k===K.OK){if(vid.paused&&vid.currentSrc)vid.play().catch(function(){});openMenu('live')}
    else if(k===K.LEFT||k===K.RIGHT||k===K.BLUE||isBack(k))openMenu('live');
    else if(k===K.INFO||k===K.YELLOW)banner('');
    else return false;
    return;
  }
  if(k===K.OK||k===K.PP||k===K.PLAY||k===K.PAUSE){if(k===K.PLAY&&!vid.paused)return;togglePause()}
  else if(k===K.LEFT||k===K.RW)seekBy(-10);
  else if(k===K.RIGHT||k===K.FF)seekBy(30);
  else if(k===K.UP||k===K.YELLOW)openTracks();
  else if(k===K.DOWN||k===K.INFO)showOsd();
  else if(inA(k,K.CHUP))seekBy(300);else if(inA(k,K.CHDN))seekBy(-300);
  else if(isBack(k)||k===K.STOP)exitVod();
  else return false;
}
function keyTracks(k){
  if(k===K.UP)TR.idx=Math.max(0,TR.idx-1);
  else if(k===K.DOWN)TR.idx=Math.min(TR.items.length-1,TR.idx+1);
  else if(k===K.OK){var t=TR.items[TR.idx];if(t){try{t.f()}catch(e){}TR.items.forEach(function(x){if(x.g===t.g)x.on=false});t.on=true;toast((t.g==='a'?'Ses: ':'Altyazı: ')+t.t)}}
  else if(isBack(k)||k===K.LEFT||k===K.RIGHT){closeTracks();return}
  else return false;
  drawTracks();
}

document.addEventListener('keydown',function(e){onKey(e.keyCode,e)});
function onKey(k,e){
  var ae=document.activeElement,typing=ae&&ae.tagName==='INPUT'&&!ae.readOnly;
  if(typing&&ae.id==='sq'){
    if(k===K.OK){endSearch(true);e.preventDefault()}
    else if(k===27||k===461||k===10009||k===K.UP||k===K.DOWN){endSearch(false);e.preventDefault()}
    return;
  }
  if(typing){
    if(k===K.OK||k===K.UP||k===K.DOWN||k===27||k===461||k===10009){ae.blur();ae.readOnly=true;if(k===K.UP)setIdx=Math.max(0,setIdx-1);if(k===K.DOWN||k===K.OK)setIdx=Math.min(fields.length-1,setIdx+1);markSet();e.preventDefault()}
    return;
  }
  var d=k>=48&&k<=57?k-48:(k>=96&&k<=105?k-96:-1);
  if(d>=0&&((screen==='player'&&playing&&playing.kind==='live')||(screen==='menu'&&sec==='live'))){digit(d);e.preventDefault();return}
  if(k===K.GREEN&&screen!=='tracks'){screen==='settings'?closeSet():openSet();e.preventDefault();return}
  var r;
  if(screen==='settings'){
    if(k===K.UP||k===K.LEFT)setIdx=Math.max(0,setIdx-1);
    else if(k===K.DOWN||k===K.RIGHT)setIdx=Math.min(fields.length-1,setIdx+1);
    else if(k===K.OK)setOk();
    else if(isBack(k)){if(LIVE.list.length)closeSet()}
    else return;
    markSet();e.preventDefault();return;
  }
  if(screen==='menu'){if(k===K.YELLOW){search();e.preventDefault();return}r=keyMenu(k)}
  else if(screen==='detail')r=keyDetail(k);
  else if(screen==='tracks')r=keyTracks(k);
  else if(screen==='player')r=keyPlayer(k);
  else if(screen==='boot'){if(k===K.OK)openSet();r=false}
  if(r!==false)e.preventDefault();
}

/* ================= imleç (fare) modu ================= */
// TV tarayıcısı ok tuşlarıyla imleç gezdiriyorsa: üzerine gelinen öğe vurgulanır, OK tıklama yapar.
var pbarT,hoverZone=null;
function setPtr(){if(PTR)return;PTR=true;document.body.classList.add('ptr');fit();if(screen==='menu')drawMenu();else if(screen==='detail')drawDetail()}
function showPbar(){
  if(screen!=='player'||!playing){$('#pbar').classList.add('hidden');return}
  var h=playing.kind==='live'
    ?'<div class="pb" data-act="menu">☰ Menü</div><div class="pb" data-act="chup">▲ Kanal +</div><div class="pb" data-act="chdn">▼ Kanal −</div><div class="pb" data-act="info">ℹ Bilgi</div>'
    :'<div class="pb" data-act="vexit">← Çık</div><div class="pb" data-act="rw">⏪ 10 sn</div><div class="pb" data-act="pp">⏯ Oynat / Durdur</div><div class="pb" data-act="ff">30 sn ⏩</div><div class="pb" data-act="tracks">💬 Dil / Altyazı</div>';
  var el=$('#pbar');if(el.getAttribute('data-k')!==playing.kind){el.innerHTML=h;el.setAttribute('data-k',playing.kind)}
  el.classList.remove('hidden');if(playing.kind==='vod')showOsd();
  clearTimeout(pbarT);pbarT=setTimeout(function(){el.classList.add('hidden')},5000);
}
var lastMove=0;
document.addEventListener('mousemove',function(e){
  if(Math.abs(e.movementX||1)+Math.abs(e.movementY||1)===0)return;
  setPtr();if(Date.now()-lastMove>300){lastMove=Date.now();if(screen==='player')showPbar()}
});
document.addEventListener('mouseover',function(e){
  if(screen!=='menu'||!e.target.closest)return;
  var z=e.target.closest('#rail')?'rail':e.target.closest('#cats')?'cats':e.target.closest('#content')?'items':null;
  if(z&&z!==zone){zone=z;hoverZone=z;if(z==='rail')railIdx=secIdx();drawMenu()}
});
var wheelT=0;
document.addEventListener('wheel',function(e){
  if(Date.now()-wheelT<120)return;wheelT=Date.now();
  var dn=e.deltaY>0;
  if(screen==='menu')keyMenu(dn?K.DOWN:K.UP);
  else if(screen==='detail'){if(D.zone!=='eps'&&D.eps.length)D.zone='eps';keyDetail(dn?K.DOWN:K.UP)}
  else if(screen==='player'&&playing&&playing.kind==='live')zap(dn?-1:1);
},{passive:true});
function act(a){
  var m=a.split(':');
  if(m[0]==='pg'){var dir=+m[2];
    if(m[1]==='eps'){D.zone='eps';keyDetail(dir<0?K.CHUP[0]:K.CHDN[0]);return}
    zone=m[1];keyMenu(dir<0?K.CHUP[0]:K.CHDN[0]);return}
  if(a==='mclose'){leaveMenuToPlayer();return}
  if(a==='dback'){if(D)closeDetail();return}
  if(a==='tclose'){closeTracks();return}
  if(a==='menu'){openMenu('live');return}
  if(a==='chup'){zap(1);showPbar();return}
  if(a==='chdn'){zap(-1);showPbar();return}
  if(a==='info'){banner('');return}
  if(a==='vexit'){exitVod();$('#pbar').classList.add('hidden');return}
  if(a==='rw'){seekBy(-10);showPbar();return}
  if(a==='ff'){seekBy(30);showPbar();return}
  if(a==='pp'){togglePause();showPbar();return}
  if(a==='tracks'){openTracks();return}
}
document.addEventListener('click',function(e){
  if(!e.target.closest)return;
  var t=e.target.closest('[data-act],[data-r],[data-c],[data-i],[data-g],[data-b],[data-s],[data-e],[data-t],#obar,.f');
  if(!t){
    if(screen==='player'){if(!playing)return;if(playing.kind==='vod'){if($('#osd').classList.contains('off')||$('#osd').classList.contains('hidden'))showPbar();else togglePause()}else openMenu('live')}
    else if(screen==='tracks')closeTracks();
    else if(screen==='boot')openSet();
    return;
  }
  if(t.hasAttribute('data-act')){act(t.getAttribute('data-act'));return}
  if(t.id==='obar'){var r=t.getBoundingClientRect();if(vid.duration&&isFinite(vid.duration)){vid.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*vid.duration;showOsd()}return}
  if(t.hasAttribute('data-r')){railIdx=+t.getAttribute('data-r');zone='rail';keyMenu(K.OK)}
  else if(t.hasAttribute('data-c')){zone='cats';var i=+t.getAttribute('data-c');if(sec==='live'){LIVE.cat=i;LIVE.query='';liveFilter();drawMenu()}else selectVodCat(curV(),i)}
  else if(t.hasAttribute('data-i')){zone='items';LIVE.idx=+t.getAttribute('data-i');keyMenu(K.OK)}
  else if(t.hasAttribute('data-g')){zone='items';curV().idx=+t.getAttribute('data-g');keyMenu(K.OK)}
  else if(t.hasAttribute('data-b')){D.zone='btns';D.bidx=+t.getAttribute('data-b');detailOk()}
  else if(t.hasAttribute('data-s')){D.zone='seasons';D.sidx=+t.getAttribute('data-s');D.eps=(D.info.episodes||{})[D.seasons[D.sidx]]||[];D.eidx=0;D.etop=0;drawDetail()}
  else if(t.hasAttribute('data-e')){D.zone='eps';playEp(+t.getAttribute('data-e'),true)}
  else if(t.hasAttribute('data-t')){TR.idx=+t.getAttribute('data-t');keyTracks(K.OK)}
  else if(screen==='settings'){setIdx=fields.indexOf(t);markSet();setOk()}
});

(function init(){
  if(EV&&!LS.get('x',null)){
    fetch('/ayar.json').then(function(r){return r.json()}).then(function(c){if(c&&c.s&&c.u&&c.p)LS.set('x',c)}).catch(function(){}).then(start);
    return;
  }
  start();
})();
function start(){
  var x=LS.get('x',null);
  if(!x){$('#splmsg').textContent='Hoş geldin';openSet();return}
  $('#splmsg').textContent='Kanallar yükleniyor…';
  login(x.s,x.u,x.p).then(function(){
    liveFilter();
    var last=LS.get('tvlast',null),i=-1;
    for(var k=0;k<LIVE.list.length;k++)if(LIVE.list[k].id===last){i=k;break}
    screen='player';playLive(i>=0?i:0);
  }).catch(function(e){openSet();$('#smsg').textContent='Hata: '+e.message});
}
